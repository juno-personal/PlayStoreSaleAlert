name: Play Store Sale Scraper

on:
  workflow_dispatch:
    inputs:
      debug:
        description: '디버그 로그 출력'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: play-store-sales
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: 01_PlayStoreSales/scraper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 01_PlayStoreSales/scraper/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('01_PlayStoreSales/scraper/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Scrape games on sale
        run: node scrape.js --out games.json --verbose

      - name: Upload scraped data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-games
          path: 01_PlayStoreSales/scraper/games.json
          retention-days: 7
          if-no-files-found: warn

      # GitHub Pages 용 정적 페이지 (docs/index.html) 갱신
      - name: Build site
        run: node build_site.mjs --in games.json

      - name: Commit site
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "사이트 변경 없음"
          else
            git commit -m "chore(site): update sale page"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Send to Google Apps Script
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: node send_to_gas.js --in games.json
